name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool lame twolame sox

      # The test suite generates its MP2/MP3 fixtures at test time.  Cache
      # them between runs so only the first run has to encode anything.
      - name: Restore generated test files
        uses: actions/cache@v4
        with:
          path: mpck/test/data
          key: mpck-test-data-${{ hashFiles('mpck/test/*.sh') }}
          restore-keys: |
            mpck-test-data-

      - name: Autogen
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Make
        run: make

      - name: Test
        run: make check
