name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool lame twolame sox python3-mutagen

      # The test suite generates its MP2/MP3 fixtures at test time.  Cache
      # them between runs so only the first run has to encode anything.  The
      # key tracks gentestdata.sh, which is what determines the fixtures; a
      # cold run only takes a few seconds.
      - name: Restore generated test files
        uses: actions/cache@v4
        with:
          path: mpck/test/data
          key: mpck-testdata-${{ hashFiles('mpck/test/gentestdata.sh') }}

      - name: Autogen
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Make
        run: make

      - name: Test
        run: make check

  debian-package:
    name: Debian package (oldstable)
    runs-on: ubuntu-latest
    # Build against Debian oldstable so the resulting glibc dependency is
    # older than the current Debian/Ubuntu releases. The tag floats to the
    # current oldstable release.
    container: debian:oldstable

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper dpkg-dev fakeroot git lintian

      - uses: actions/checkout@v4

      - name: Check build dependencies
        run: dpkg-checkbuilddeps

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Check package with lintian
        run: lintian --profile debian --display-info --fail-on error ../*.changes

      - name: Collect Debian package
        run: |
          mkdir -p dist
          cp ../*.deb ../*.changes ../*.buildinfo dist/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mpck-debian-package
          path: dist/*
          if-no-files-found: error

      - name: Install and smoke test package
        run: |
          apt-get install -y ../mpck_*.deb
          mpck --version
          test -f /usr/share/man/man1/mpck.1.gz
