name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool lame twolame sox python3-mutagen

      # The test suite generates its MP2/MP3 fixtures at test time.  Cache
      # them between runs so only the first run has to encode anything.  The
      # key tracks gentestdata.sh, which is what determines the fixtures; a
      # cold run only takes a few seconds.
      - name: Restore generated test files
        uses: actions/cache@v4
        with:
          path: mpck/test/data
          key: mpck-testdata-${{ hashFiles('mpck/test/gentestdata.sh') }}

      - name: Autogen
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Make
        run: make

      - name: Test
        run: make check

  debian-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper fakeroot lintian

      - name: Check build dependencies
        run: dpkg-checkbuilddeps

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Check package with lintian
        run: lintian --profile debian --display-info --fail-on error ../*.changes

      - name: Install and smoke test package
        run: |
          sudo apt-get install -y ../mpck_*.deb
          mpck --version
          test -f /usr/share/man/man1/mpck.1.gz
